<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>Dahju demo</title>
  <meta name="description" content="Real-time certainty. Independently assured."/>
  <link rel="manifest" href="../manifest.webmanifest"/>
  <meta name="theme-color" content="#000000"/>
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/favicon-32.png"/>
  <link rel="apple-touch-icon" sizes="180x180" href="../icons/apple-touch-icon.png"/>
  <meta name="apple-mobile-web-app-title" content="Dahju"/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Dahju demo"/>
  <meta property="og:description" content="Real-time certainty. Independently assured."/>
  <meta property="og:image" content="https://pointrock-global.github.io/thames-assurance-demo/icons/og-card.png"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <style>
    :root { --or: #F06E1E; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; background: #000; color: #fff; font-family: "Liberation Sans", Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
      background: #000 url('bg-welcome.jpg') center / cover no-repeat;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(28px + env(safe-area-inset-bottom)); text-align: center; }
    main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; max-width: 520px; }
    .brand { font-weight: 700; font-size: clamp(56px, 16vw, 96px); line-height: 1; letter-spacing: -0.01em; color: #fff; text-shadow: 0 2px 24px rgba(0,0,0,0.6); }
    .brand .ast { color: var(--or); }
    .tag { font-weight: 400; color: var(--or); font-size: clamp(17px, 4.6vw, 24px); margin-top: 16px; text-shadow: 0 1px 10px rgba(0,0,0,0.8); }
    .btn { display: inline-flex; align-items: center; justify-content: center; width: min(100%, 340px); min-height: 54px; margin-top: 44px;
      border-radius: 12px; background: var(--or); color: #fff; font-weight: 700; font-size: 17px; text-decoration: none;
      box-shadow: 0 8px 22px rgba(240,110,30,0.35); transition: background .15s; }
    .btn:hover, .btn:focus-visible { background: #FF8236; }
    .note { color: #fff; font-size: 14px; margin-top: 16px; text-shadow: 0 1px 8px rgba(0,0,0,0.8); }
    footer { display: flex; align-items: center; justify-content: center; gap: 10px; color: #fff; font-size: 13px; letter-spacing: 0.04em; }
    footer img { height: 24px; width: auto; display: block; }
  </style>
</head>
<body>
  <main>
    <h1 class="brand" aria-label="Dahju">Dahju<span class="ast">*</span></h1>
    <p class="tag">Real-time certainty. Independently assured.</p>
    <a class="btn" href="01-login-dark.html">Open the demo</a>
    <p class="note">Best viewed on a larger screen.</p>
  </main>
  <footer><span>Powered by</span><img src="../icons/pointrock-logo.png" alt="PointRock"/></footer>
</body>
</html>
