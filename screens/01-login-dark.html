<style>
* { box-sizing:border-box; margin:0; padding:0; }
html, body { width:1440px; height:900px; overflow:hidden; font-family:Inter,system-ui,sans-serif; }
.login-bg {
  position:absolute; inset:0;
  background: radial-gradient(ellipse at center, rgba(0,0,0,0.25), rgba(0,0,0,0.05) 70%), #000 url('bg-login-site.jpg') center / cover no-repeat;
}
.card {
  position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
  width:420px; padding:40px 44px 36px; text-align:center;
  background: rgba(12,22,42,0.82);
  border:1px solid rgba(0,180,240,0.35);
  box-shadow: 0 24px 64px rgba(0,0,0,0.45), 0 0 40px rgba(0,156,222,0.1);
  border-radius:22px; z-index:2;
}
.logo-wrap { display:flex; justify-content:center; }
.logo-plate {
  background:#fff; border-radius:16px; padding:10px 12px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.25);
}
.logo-plate img { width:80px; height:80px; display:block; }
.card h1 { font-size:20px; font-weight:650; margin:18px 0 4px; color:#F4F8FC; }
.card .hint { font-size:12.5px; margin-bottom:28px; color:#FFFFFF; }
.field {
  display:flex; align-items:center; gap:10px; height:46px; border-radius:12px;
  padding:0 14px; margin-bottom:12px; font-size:13.5px; text-align:left;
  background:rgba(8,16,32,0.7); border:1px solid rgba(120,170,210,0.22); color:#FFFFFF;
}
.field .ph { flex:1; }
.btn {
  width:100%; height:46px; border:none; border-radius:12px; margin-top:10px;
  background: linear-gradient(180deg,#00B4F0,#009CDE); color:#fff; font-weight:650; font-size:14.5px;
  box-shadow: 0 8px 22px rgba(0,156,222,0.45);
}
.sso {
  margin-top:24px; font-size:12.5px; display:flex; align-items:center; gap:10px;
  justify-content:center; color:#FFFFFF;
}
.sso::before, .sso::after { content:""; flex:1; height:1px; background:rgba(180,200,220,0.18); }

.brand-tag {
  position:absolute; bottom:28px; left:0; right:0; text-align:center; z-index:2;
  font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#FFFFFF;
}
.dahju { font-family: "Liberation Sans", Arial, Helvetica, sans-serif; font-weight: 700; font-size: 46px; line-height: 1; color: #fff; letter-spacing: -0.01em; }
.dahju .ast { color: #F06E1E; }
.dahju-tag { font-family: "Liberation Sans", Arial, Helvetica, sans-serif; font-weight: 400; color: #F06E1E; font-size: 14px; margin: 10px 0 6px; }
.brand-tag { display: flex; align-items: center; justify-content: center; gap: 10px; text-transform: none !important; letter-spacing: 0.04em !important; font-size: 12px !important; color: #FFFFFF !important; }
.brand-tag img { height: 22px; width: auto; display: block; }
@media (max-width: 1199px) { .card { width: min(420px, calc(100vw - 28px)) !important; padding: 32px 22px 28px !important; } .field, .btn { height: 50px !important; font-size: 15px !important; } .card .hint { font-size: 14px !important; } }
.card { border: 1px solid transparent !important; background: linear-gradient(#050505,#050505) padding-box, linear-gradient(135deg,#B8501A 0%,#FF9A50 35%,#C85A20 60%,#FF9A50 85%,#B8501A 100%) border-box !important; box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), 0 0 14px rgba(240,110,30,0.16), 0 22px 50px rgba(0,0,0,0.7) !important; }
.field { background: #0d0d0d !important; border-color: rgba(160,160,160,0.25) !important; color: #FFFFFF !important; }
.btn { background: #F06E1E !important; color: #fff !important; box-shadow: 0 8px 22px rgba(240,110,30,0.35) !important; cursor: pointer; transition: background .15s; }
.btn:hover { background: #FF8236 !important; }
.sso b { color: #F06E1E !important; }
.hint, .sso, .brand-tag, .field .ph, .field { color: #FFFFFF !important; }
.dahju-tag { color: #F06E1E !important; }

  <div class="dahju-tag">Real-time certainty. Independently assured.</div>
  <div class="hint">Secure access</div>
  <div class="field"><span>✉</span><span class="ph">Email address</span></div>
  <div class="field"><span>🔒</span><span class="ph">Password</span><span style="opacity:0.5">👁</span></div>
  <button class="btn">Sign in</button>
  <div class="sso">Sign in with <b>company SSO</b></div>
</div>
<div class="brand-tag"><span>Powered by</span><img src="../icons/pointrock-logo.png" alt="PointRock"/></div>
